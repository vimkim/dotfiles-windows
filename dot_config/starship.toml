[shlvl]
disabled = false
format = 'SHLVL\($shlvl\) '
threshold = 3

[shell]
disabled = false

[directory]
fish_style_pwd_dir_length = 5

[git_commit]
commit_hash_length = 7
only_detached = false
format = "[$hash ]($style)"
style = "bold yellow"

[status]
disabled = false

[sudo]
disabled = false

[direnv]
disabled = false

[env_var.PRESET_MODE]
format = "\nMOD: [$env_value]($style) "
style = "bold dimmed yellow"

[env_var.CUBRID]
format = "CUB: [$env_value]($style) "
style = "bold dimmed yellow"

[env_var.CUBRID_DATABASES]
format = "CUBDB: [$env_value]($style) "
style = "bold dimmed yellow"

[custom.java_home]
description = "Show JAVA_HOME when CUBRID is active"
command = "Write-Output $env:JAVA_HOME"
when = "$env:CUBRID -and $env:JAVA_HOME"
shell = ["powershell.exe", "-NoProfile", "-Command"]
format = "JAVA: [$output]($style) "
style = "bold dimmed yellow"

[kubernetes]
disabled = false

[os]
disabled = false

